name: Deploy Horizon Web

on:
  push:
    branches: [main, master]
    paths:
      - 'horizon-web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Package Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: horizon-web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'horizon-web/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Verify Build Output
        run: ls -la dist/
