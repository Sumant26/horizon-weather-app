name: Horizon CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Flutter Mobile App Verification
  # ---------------------------------------------------------------------------
  flutter-verification:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java SDK (for Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Code Analysis (0 Error / 0 Warning Mandate)
        run: flutter analyze

      - name: Execute Automated Test Suite
        run: flutter test --coverage

      - name: Build Android Release APK (Verification)
        run: flutter build apk --release

  # ---------------------------------------------------------------------------
  # Job 2: Horizon Web (React + TypeScript + Vite) Verification
  # ---------------------------------------------------------------------------
  web-verification:
    name: Web Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: horizon-web

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'horizon-web/package-lock.json'

      - name: Install Node Dependencies
        run: npm ci

      - name: TypeScript Static Type Checking
        run: npm run typecheck

      - name: ESLint Code Inspection
        run: npm run lint

      - name: Vitest Automated Test Suite
        run: npm test

      - name: Production Bundle Build (Vite)
        run: npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-web-dist
          path: horizon-web/dist
          retention-days: 7
